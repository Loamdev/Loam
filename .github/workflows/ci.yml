name: CI

on:
  push:
    branches: [main]
  # No branch filter: phase branches are stacked, so a PR whose base is another
  # phase branch rather than main must still get its checks.
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# One run per ref; a new push cancels the in-flight run for that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single place to bump the toolchain for every job.
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: "v2.12.2"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error title=gofmt::The following files are not gofmt-formatted:"
            echo "$files"
            echo
            echo "--- gofmt diff ---"
            gofmt -d .
            echo
            echo "Fix it locally with:   gofmt -w .      (or: make fmt)"
            echo "Then commit the result and push again."
            exit 1
          fi
          echo "gofmt: all files formatted."

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=go vet::go vet reported problems."
          echo "Reproduce locally with:   go vet ./...     (or: make vet)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=golangci-lint::The linter reported problems."
          echo "Install the pinned version:"
          echo "  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "Reproduce locally with:   golangci-lint run ./...   (or: make lint)"
          echo "Many findings auto-fix with:   golangci-lint run --fix ./..."

  test:
    name: go test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=go test::Tests failed or the race detector fired."
          echo "Reproduce locally with:   go test -race ./...     (or: make test-race)"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: Verify go.mod and go.sum are tidy
        run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo
            echo "::error title=go mod tidy::go.mod / go.sum are not tidy (the diff above is what 'go mod tidy' changed)."
            echo "Fix it locally with:   go mod tidy      (or: make tidy)"
            echo "Then commit go.mod and go.sum."
            exit 1
          fi
          echo "go.mod and go.sum are tidy."

  build:
    name: build (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all packages (host)
        run: go build ./...

      - name: Cross-compile windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go build -o dist/playbrige-windows-amd64.exe .

      - name: Cross-compile darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build ./...
          go build -o dist/playbrige-darwin-arm64 .

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=build::The CLI no longer builds for every supported OS."
          echo "Reproduce locally with:"
          echo "  go build ./...                                (or: make build)"
          echo "  GOOS=windows GOARCH=amd64 go build ./..."
          echo "  GOOS=darwin  GOARCH=arm64 go build ./..."
          echo "Keep the code OS-portable: use filepath.Join, no unix-only syscalls."

  integration:
    name: integration (live Postgres)
    runs-on: ubuntu-latest

    # The same image and credentials as testapp/docker-compose.yml, so the
    # schema under test is exactly the fixture the acceptance tests describe.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A service container cannot run /docker-entrypoint-initdb.d, so the
      # fixture schema is applied by hand once Postgres is healthy.
      - name: Load the fixture schema
        run: |
          psql "$PLAYBRIGE_TEST_DB" -v ON_ERROR_STOP=1 -f testapp/initdb/001_schema.sql
          echo "Tables created:"
          psql "$PLAYBRIGE_TEST_DB" -Atc "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY 1"
        env:
          PLAYBRIGE_TEST_DB: postgres://appuser:apppass@localhost:5433/appdb

      - name: Integration tests against the live schema
        run: go test ./... -run 'Fixture|Integration' -v
        env:
          PLAYBRIGE_TEST_DB: postgres://appuser:apppass@localhost:5433/appdb

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=integration::Introspection no longer matches the testapp fixture."
          echo "Reproduce locally:"
          echo "  playbrige up --dir testapp"
          echo "  PLAYBRIGE_TEST_DB=postgres://appuser:apppass@localhost:5433/appdb go test ./... -run Fixture -v"
          echo "  playbrige down --dir testapp"

  e2e:
    name: end-to-end (real Docker)
    runs-on: ubuntu-latest
    # The whole cycle involves image pulls on a cold runner.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Show Docker version
        run: |
          docker version
          docker compose version

      # Pulling up front keeps the timing assertions about Playbrige rather than
      # about the runner's network.
      - name: Pre-pull the fixture images
        run: |
          docker pull postgres:16-alpine
          docker pull nginx:alpine

      - name: Build the CLI
        run: go build -o bin/playbrige .

      # This is the build spec's section 11 definition of done: one command to a
      # seeded app, one command back to nothing left behind.
      - name: End-to-end acceptance test
        run: go test -tags=e2e -v -timeout 15m .

      - name: Prove nothing was left behind
        if: always()
        run: |
          echo "--- containers ---"
          docker ps -a --filter "name=pb_" --format '{{.Names}}'
          echo "--- networks ---"
          docker network ls --filter "name=pb_" --format '{{.Name}}'
          echo "--- volumes ---"
          docker volume ls --filter "name=pb_" --format '{{.Name}}'
          leftovers=$(docker ps -aq --filter "name=pb_"; docker volume ls -q --filter "name=pb_")
          if [ -n "$leftovers" ]; then
            echo "::error title=teardown::playbrige down left resources behind."
            exit 1
          fi
          echo "Clean: no leftover containers, networks, or volumes."

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=e2e::The end-to-end acceptance test failed."
          echo "Reproduce locally (needs Docker running):"
          echo "  go test -tags=e2e -v -timeout 15m ."
          echo "Or drive it by hand:"
          echo "  playbrige up --dir testapp && playbrige status && playbrige down --dir testapp"
