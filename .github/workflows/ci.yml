name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# One run per ref; a new push cancels the in-flight run for that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single place to bump the toolchain for every job.
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: "v2.12.2"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error title=gofmt::The following files are not gofmt-formatted:"
            echo "$files"
            echo
            echo "--- gofmt diff ---"
            gofmt -d .
            echo
            echo "Fix it locally with:   gofmt -w .      (or: make fmt)"
            echo "Then commit the result and push again."
            exit 1
          fi
          echo "gofmt: all files formatted."

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=go vet::go vet reported problems."
          echo "Reproduce locally with:   go vet ./...     (or: make vet)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=golangci-lint::The linter reported problems."
          echo "Install the pinned version:"
          echo "  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "Reproduce locally with:   golangci-lint run ./...   (or: make lint)"
          echo "Many findings auto-fix with:   golangci-lint run --fix ./..."

  test:
    name: go test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=go test::Tests failed or the race detector fired."
          echo "Reproduce locally with:   go test -race ./...     (or: make test-race)"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: Verify go.mod and go.sum are tidy
        run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo
            echo "::error title=go mod tidy::go.mod / go.sum are not tidy (the diff above is what 'go mod tidy' changed)."
            echo "Fix it locally with:   go mod tidy      (or: make tidy)"
            echo "Then commit go.mod and go.sum."
            exit 1
          fi
          echo "go.mod and go.sum are tidy."

  build:
    name: build (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all packages (host)
        run: go build ./...

      - name: Cross-compile windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go build -o dist/playbrige-windows-amd64.exe .

      - name: Cross-compile darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build ./...
          go build -o dist/playbrige-darwin-arm64 .

      - name: How to reproduce
        if: failure()
        run: |
          echo "::error title=build::The CLI no longer builds for every supported OS."
          echo "Reproduce locally with:"
          echo "  go build ./...                                (or: make build)"
          echo "  GOOS=windows GOARCH=amd64 go build ./..."
          echo "  GOOS=darwin  GOARCH=arm64 go build ./..."
          echo "Keep the code OS-portable: use filepath.Join, no unix-only syscalls."
